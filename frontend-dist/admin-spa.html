</style><script id="gh-user-chip-script">
(function () {
  var CHIP_ID = 'gh-user-chip';
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function logout(btn) {
    btn.disabled = true;
    btn.textContent = '\u9000\u51fa\u4e2d';
    fetch('/api/auth/logout', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    }).then(function () {
      location.href = '/';
    }).catch(function () {
      location.reload();
    });
  }
  function render(data) {
    if (document.getElementById(CHIP_ID)) return;
    var displayName = data.name || data.login || '\u5df2\u767b\u5f55';
    var initial = esc(displayName.charAt(0).toUpperCase());
    var chip = document.createElement('div');
    chip.id = CHIP_ID;
    chip.innerHTML = '<span class="gh-avatar-slot"></span>' +
      '<span class="gh-meta"><span class="gh-name">' + esc(displayName) + '</span>' +
      (data.login ? '<span class="gh-login">@' + esc(data.login) + '</span>' : '') +
      '</span><button type="button">\u9000\u51fa</button>';
    var slot = chip.querySelector('.gh-avatar-slot');
    if (data.avatar) {
      var img = new Image();
      img.referrerPolicy = 'no-referrer';
      img.alt = '';
      img.onload = function () { slot.innerHTML = ''; slot.appendChild(img); };
      // GitHub 头像在国内可能加载失败，退回首字母
      img.onerror = function () { slot.innerHTML = '<span class="gh-avatar-fallback">' + initial + '</span>'; };
      img.src = data.avatar;
    } else {
      slot.innerHTML = '<span class="gh-avatar-fallback">' + initial + '</span>';
    }
    document.body.appendChild(chip);
    chip.querySelector('button').addEventListener('click', function () { logout(this); });
  }
  function load() {
    fetch('/api/auth/github/me', {
      credentials: 'same-origin',
      headers: { 'Accept': 'application/json' }
    }).then(function (res) {
      return res.ok ? res.json() : null;
    }).then(function (data) {
      if (data && data.authenticated) render(data);
    }).catch(function () {});
  }
  function ready(fn) {
    var app = document.getElementById('app');
    if (!app) return fn();
    var tries = 0;
    (function tick() {
      if (!app.hasAttribute('inert') || tries++ > 40) return fn();
      setTimeout(tick, 100);
    })();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { ready(load); });
  } else {
    ready(load);
  }
})();
</script>
<script id="hide-admin-menus">
(function () {
  // 普通用户也能进后台（只看到自己的文件），但站点级页面只对管理员开放
  var isAdmin = null;
  var pending = false;
  var PATTERN = /用户管理|系统设置|User Management|System Settings/i;

  function apply() {
    if (isAdmin !== false) return;
    var options = document.querySelectorAll('.page-option');
    for (var i = 0; i < options.length; i++) {
      var text = (options[i].textContent || '').trim();
      if (PATTERN.test(text)) options[i].style.display = 'none';
    }
  }

  function schedule() {
    if (pending || isAdmin !== false) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; apply(); });
  }

  fetch('/api/auth/github/me', { credentials: 'include' })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (!data || !data.authenticated) return;
      isAdmin = !!data.admin;
      if (!isAdmin) apply();
    })
    .catch(function () {});

  new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<script id="filter-only-filetype">
(function () {
  // 后台筛选面板只保留「文件类型」分组，其余分组（访问状态/黑白名单/审查结果/渠道类型…）隐藏
  // 用白名单匹配标题文案，中英文都覆盖；找不到匹配时全部保留，避免筛选面板变空
  var KEEP = /^(文件类型|File Type)$/i;
  var pending = false;

  function apply() {
    var menus = document.querySelectorAll('.filter-dropdown-menu');
    for (var m = 0; m < menus.length; m++) {
      var sections = menus[m].querySelectorAll('.filter-section');
      var hasKeep = false;
      for (var k = 0; k < sections.length; k++) {
        var t = sections[k].querySelector('.filter-title');
        if (t && KEEP.test((t.textContent || '').trim())) { hasKeep = true; break; }
      }
      if (!hasKeep) continue;
      for (var i = 0; i < sections.length; i++) {
        var title = sections[i].querySelector('.filter-title');
        var text = title ? (title.textContent || '').trim() : '';
        var keep = KEEP.test(text);
        if (keep) {
          if (sections[i].style.display === 'none') sections[i].style.display = '';
        } else if (sections[i].style.display !== 'none') {
          sections[i].style.display = 'none';
        }
      }
    }
  }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; apply(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', schedule);
  } else {
    schedule();
  }
  new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<script id="link-format-only-format-preference">
(function () {
  // 「链接格式」弹窗只保留「格式偏好」区块，隐藏「内容偏好」（Telegram / S3 等各渠道复制内容）
  var TITLE = /^(链接格式|Link Format)$/i;
  var KEEP = /^(格式偏好|Format Preference)$/i;
  var pending = false;

  function apply() {
    var dialogs = document.querySelectorAll('.el-dialog');
    for (var d = 0; d < dialogs.length; d++) {
      var titleEl = dialogs[d].querySelector('.el-dialog__title') || dialogs[d].querySelector('.el-dialog__header');
      var titleText = titleEl ? (titleEl.textContent || '').trim() : '';
      if (!TITLE.test(titleText)) continue;

      var sections = dialogs[d].querySelectorAll('.dialog-section');
      if (!sections.length) continue;

      var keepIndex = -1;
      for (var i = 0; i < sections.length; i++) {
        var head = sections[i].querySelector('.section-header');
        if (head && KEEP.test((head.textContent || '').trim())) { keepIndex = i; break; }
      }
      // 文案对不上就退回「保留第一个区块」，避免弹窗被清空
      if (keepIndex < 0) keepIndex = 0;

      for (var j = 0; j < sections.length; j++) {
        var show = (j === keepIndex);
        if (show) {
          if (sections[j].style.display === 'none') sections[j].style.display = '';
        } else if (sections[j].style.display !== 'none') {
          sections[j].style.display = 'none';
        }
      }
    }
  }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; apply(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', schedule);
  } else {
    schedule();
  }
  new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<script id="hide-logout-buttons">
(function () {
  // 隐藏「退出登录」图标按钮（退出统一走左上角用户卡片）：
  //   1) 上传页右下角快捷工具栏 .quick-toolbar-button
  //   2) 后台顶栏 .admin-header-control
  // 不用 CSS :has()，老浏览器不支持会整条规则失效；这里按图标/文案匹配 DOM
  var pending = false;

  function isLogout(el) {
    var html = el.innerHTML || '';
    // FA6 把 sign-out-alt 改名为 right-from-bracket（sign-out-alt 只是别名），
    // 所以 DOM 里出现的是 fa-right-from-bracket / data-icon="right-from-bracket"
    if (/right-from-bracket|sign-out|signout|door-open/i.test(html)) return true;
    var label = (el.getAttribute('aria-label') || '') + ' ' + (el.getAttribute('title') || '');
    return /退出登录|退出|log\s*-?\s*out/i.test(label);
  }

  function hide(el) {
    if (el && el.style.display !== 'none') el.style.display = 'none';
  }

  function apply() {
    var inners = document.querySelectorAll('.quick-toolbar-actions-inner');
    for (var i = 0; i < inners.length; i++) {
      var btns = inners[i].querySelectorAll('.quick-toolbar-button');
      for (var j = 0; j < btns.length; j++) {
        if (isLogout(btns[j])) hide(btns[j]);
      }
    }

    var headers = document.querySelectorAll('.admin-header-actions');
    for (var k = 0; k < headers.length; k++) {
      var ctrls = headers[k].querySelectorAll('.admin-header-control');
      for (var m = 0; m < ctrls.length; m++) {
        if (isLogout(ctrls[m])) hide(ctrls[m]);
      }
    }
  }

  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; apply(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', schedule);
  } else {
    schedule();
  }
  new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
