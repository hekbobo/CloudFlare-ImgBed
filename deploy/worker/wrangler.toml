# Cloudflare Workers 部署配置
# 使用方式: npx wrangler deploy --config deploy/worker/wrangler.toml
#
# 部署前需要配置以下 binding：
# 1. D1 数据库 - 取消注释并填入你的 database_id
# 2. R2 存储桶 - 取消注释并填入你的 bucket_name
# 3. KV 命名空间 - 如果使用 KV 而非 D1，取消注释并填入 id
# 4. 普通环境变量 - 在 [vars] 中配置；敏感值请使用 wrangler secret put/bulk
#
# GitHub Actions 部署时会自动从 GitHub Secrets 生成此文件，
# WORKER_VARS 支持 { "变量名": { "value": "值", "type": "text或secret" } }，
# type 默认为 text，secret 会在部署后统一上传，不写入 [vars]。
# 无需手动编辑。详见 .github/workflows/deploy-worker.yml

name = "cloudflare-imgbed"
main = "index.js"
compatibility_date = "2024-08-21"
# 让 Worker 对自身 zone 的 fetch() 走公网入口，不要直连 origin。
compatibility_flags = ["global_fetch_strictly_public"]

# 静态资源（前端文件）
[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 所有请求先进入 Worker，再由 Worker 决定是走业务路由还是交还静态资源。
# 不能只在白名单里写 "/"：那样静态资源层会接管其余路径，
# 用 SPA fallback 直接返回 index.html，把 /api 接口一起吞掉。
run_worker_first = true

# Cloudflare Images 原生图片处理
[images]
binding = "IMAGES"

[vars]
# AI_CONFIG_SECRET 请配置为 Secret，值为至少 32 个字符的随机密钥。
# 敏感值（AUTH_CODE / BASIC_PASS / TG_BOT_TOKEN 等）不要写在这里，
# 用 npx wrangler secret put <NAME> --config deploy/worker/wrangler.toml 上传。
# TG_BOT_TOKEN = ""
# TG_CHAT_ID = ""

# ===== 上传大小限制 =====
# 单个文件上限（MB），默认 3，不配置时同样按 3MB 处理。
# 服务端强校验（/upload、分块上传、HuggingFace 直传三条路径），前端 3MB 预检只是提升提示体验。
MAX_UPLOAD_SIZE_MB = "3"

# ===== GitHub OAuth 登录（配置任意一项前，先看下面顺序）=====
# 1) GITHUB_CLIENT_ID     非敏感，可写在此处；配置后登录门禁才会启用
# 2) GITHUB_CLIENT_SECRET 必须用 secret 上传（wrangler secret put）
# 3) GITHUB_ALLOWED_USERS 必须用 secret 上传，逗号分隔的 GitHub 用户名；留空 = 拒绝所有人
# 4) GITHUB_ADMIN_USERS   可选，拥有管理后台权限的用户；不填则默认等于 ALLOWED
# 5) GITHUB_REDIRECT_URI  可选，默认 https://<你的域名>/api/auth/github/callback
# GITHUB_CLIENT_ID = ""

# ===== 元数据库（必须）：D1 =====
[[d1_databases]]
binding = "img_d1"
database_name = "img_d1"
database_id = "1ac9db75-445f-48bd-b5a4-8261ad1942b9"

# ===== 图片存储（必须）：R2 =====
[[r2_buckets]]
binding = "img_r2"
bucket_name = "img-r2"

# ===== 元数据库（可选）：KV，仅在不用 D1 时启用 =====
# 注意：D1 与 KV 二选一，同时配置会以 D1 为准。
# [[kv_namespaces]]
# binding = "img_url"
# id = ""
